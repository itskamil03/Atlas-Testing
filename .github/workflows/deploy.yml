name: Atlas Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ================================
  # JOB 1: SonarQube Code Quality
  # ================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ================================
  # JOB 2: Trivy Scan (sirf scan ke liye, real .env nahi chahiye)
  # ================================
  build-and-scan:
    name: Build Image & Trivy Security Scan
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker Image (scan ke liye)
        run: |
          docker build -t atlas-frontend:${{ github.sha }} .
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: atlas-frontend:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          output: trivy-report.txt
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt

  # ================================
  # JOB 3: Deploy on VPS (git pull + build wahi .env se)
  # ================================
  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: build-and-scan
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            cd /home/purushotam/atlas/atlas_frontend
            echo "🔄 Pulling latest code..."
            git pull origin main
            cd /home/purushotam/atlas
            echo "🚀 Building & restarting container..."
            docker compose build atlas-frontend
            docker compose up -d --no-deps --force-recreate atlas-frontend
            echo "✅ Container started successfully!"
            docker compose ps atlas-frontend
